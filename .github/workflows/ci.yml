name: CI - Quality, Tests & SonarCloud

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Run Pytest with coverage
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
        run: pytest --cov=apps --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Notify Telegram (CI result)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS=$([ "${{ job.status }}" = "success" ] && echo "SUCCESS" || echo "FAILED")
          python scripts/notify_telegram.py \
            --title "CI Pipeline (Lint + Pytest)" \
            --status "$STATUS" \
            --version "${GITHUB_SHA::7}" \
            --details "Branch: ${{ github.ref_name }}"